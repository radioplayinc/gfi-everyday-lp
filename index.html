<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gurilla Finance</title>
<style id="gfi-boot-css">
  html,body{height:100%;margin:0;background:#050506;color:#f7f7f5;font-family:Inter,system-ui,sans-serif;overflow:hidden}
</style>
</head>
<body>
<div id="gfi-gate" class="gfi-gate">
  <div class="gfi-gate-card">
    <div class="gfi-logo-wrap" id="gfiLogoWrap">
      <div class="gfi-logo-ring" id="gfiLogoRing"></div>
      <img class="gfi-logo-mark" id="gfiLogoMark" alt="Gurilla Finance" />
    </div>
    <p class="gfi-status" id="gfiStatus">Opening the floor…</p>
    <button id="gfiEnter" type="button" disabled>Enter</button>
  </div>
</div>
<style id="gfi-gate-css">
  .gfi-gate{position:fixed;inset:0;z-index:2147483646;display:grid;place-items:center;background:#050506;transition:opacity .7s ease,visibility .7s ease}
  .gfi-gate.is-out{opacity:0;visibility:hidden;pointer-events:none}
  .gfi-gate-card{width:min(520px,calc(100vw - 1.5rem));text-align:center;padding:.6rem .6rem 1.2rem}
  .gfi-logo-wrap{position:relative;width:min(420px,86vw);aspect-ratio:1;margin:0 auto .85rem;border-radius:28px;overflow:hidden;background:#0a0a0b;box-shadow:0 24px 80px rgba(0,0,0,.55)}
  .gfi-logo-ring{position:absolute;inset:10px;border-radius:22px;border:1px solid rgba(200,200,200,.12);pointer-events:none;z-index:2}
  .gfi-logo-ring:before{content:"";position:absolute;inset:-3px;border-radius:24px;border:2px solid transparent;border-top-color:#d4d4d6;border-right-color:rgba(180,180,184,.55);animation:gfiSpin 1.15s linear infinite}
  .gfi-logo-ring.is-ready:before{animation:none;border-color:rgba(160,160,164,.35)}
  .gfi-logo-mark{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:gfiPulse 2.6s ease-in-out infinite;filter:drop-shadow(0 12px 28px rgba(0,0,0,.45))}
  .gfi-logo-wrap.is-ready .gfi-logo-mark{animation:gfiSettle .7s ease forwards}
  @keyframes gfiSpin{to{transform:rotate(360deg)}}
  @keyframes gfiPulse{0%,100%{transform:scale(1);opacity:.96}50%{transform:scale(1.015);opacity:1}}
  @keyframes gfiSettle{from{transform:scale(1.01);opacity:.96}to{transform:scale(1);opacity:1}}
  .gfi-status{min-height:1.2em;margin:0 0 1.1rem;font-size:.78rem;letter-spacing:.08em;color:#8a8a86}
  #gfiEnter{appearance:none;border:1px solid rgba(247,247,245,.16);background:#141416;color:rgba(247,247,245,.38);font:600 .78rem Inter,system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;padding:.95rem 2.4rem;border-radius:999px;cursor:not-allowed;transition:background .2s,color .2s,border-color .2s,box-shadow .2s,transform .2s}
  #gfiEnter.is-on{cursor:pointer;background:#fff;color:#000;border-color:#fff;box-shadow:0 0 0 1px #fff,0 12px 40px rgba(247,247,245,.16)}
  #gfiEnter.is-on:hover{transform:translateY(-1px)}
  @media (prefers-reduced-motion:reduce){.gfi-logo-ring:before,.gfi-logo-mark{animation:none}}
</style>
<script>
(function(){
  const PART_MAX = 200;
  const status = document.getElementById("gfiStatus");
  const mark = document.getElementById("gfiLogoMark");
  function setStatus(t){ if(status) status.textContent = t; }
  fetch("gfi-brand/gate-logo.b64",{cache:"force-cache"}).then(function(r){return r.ok?r.text():""}).then(function(b){ if(b&&mark) mark.src="data:image/jpeg;base64,"+b.trim(); }).catch(function(){});

  function gateScript(){
    return "(function(){var ready=false;var gate=document.getElementById('gfi-gate');var btn=document.getElementById('gfiEnter');var wrap=document.getElementById('gfiLogoWrap');var ring=document.getElementById('gfiLogoRing');var st=document.getElementById('gfiStatus');var mark=document.getElementById('gfiLogoMark');if(mark&&!mark.getAttribute('src')){fetch('gfi-brand/gate-logo.b64',{cache:'force-cache'}).then(function(r){return r.ok?r.text():''}).then(function(b){if(b)mark.src='data:image/jpeg;base64,'+b.trim();});}function freeze(){document.documentElement.classList.add('gfi-gated');document.body.classList.add('gfi-gated');}function release(){document.documentElement.classList.remove('gfi-gated');document.body.classList.remove('gfi-gated');document.documentElement.style.overflow='';document.documentElement.style.height='';document.body.style.overflow='';document.body.style.height='';document.body.style.position='';document.body.style.width='';window.dispatchEvent(new Event('resize'));window.dispatchEvent(new Event('scroll'));}function arm(){if(ready)return;ready=true;if(wrap)wrap.classList.add('is-ready');if(ring)ring.classList.add('is-ready');if(btn){btn.disabled=false;btn.classList.add('is-on');}if(st)st.textContent='Ready.';freeze();}function unlock(){if(!ready)return;if(gate){gate.classList.add('is-out');setTimeout(function(){if(gate&&gate.parentNode)gate.parentNode.removeChild(gate);},800);}release();}function waitImgs(){var imgs=[].slice.call(document.images||[]).filter(function(i){return !i.complete&&i.id!=='gfiLogoMark';});if(!imgs.length){arm();return;}var left=imgs.length;function done(){left--;if(left<=0)arm();}imgs.forEach(function(i){i.addEventListener('load',done,{once:true});i.addEventListener('error',done,{once:true});});setTimeout(arm,8000);}if(btn)btn.addEventListener('click',unlock);document.addEventListener('keydown',function(e){if(ready&&(e.key==='Enter'||e.key===' ')){e.preventDefault();unlock();}});if(document.readyState==='complete')waitImgs();else window.addEventListener('load',waitImgs);})();";
  }

  function injectGate(html){
    var gate = document.getElementById("gfi-gate");
    var gateCss = document.getElementById("gfi-gate-css");
    var css = gateCss ? gateCss.outerHTML : "";
    css += "<style id=\"gfi-gate-lock\">html.gfi-gated,body.gfi-gated{overflow:hidden!important;overscroll-behavior:none}html:not(.gfi-gated),body:not(.gfi-gated){overflow:visible!important;height:auto!important}</style>";
    var gateHtml = gate ? gate.outerHTML : "";
    var boot = "<script>" + gateScript() + "<\\/script>";
    if (/id=[\"']gfi-gate[\"']/.test(html)) return html;
    if (/<body[^>]*>/i.test(html)) {
      return html.replace(/<body([^>]*)>/i, function(m, attrs){
        return "<body" + attrs + ">" + css + gateHtml + boot;
      });
    }
    return css + gateHtml + boot + html;
  }

  async function assemble(){
    var chunks = [];
    var misses = 0;
    for (var i = 0; i < PART_MAX; i++){
      try {
        var res = await fetch("parts/c" + i + ".txt", { cache: "no-store" });
        if (!res.ok){
          misses++;
          if (misses >= 8 && chunks.length) break;
          continue;
        }
        misses = 0;
        chunks.push(await res.text());
        if (i % 12 === 0) setStatus("Loading the floor… " + Math.min(99, Math.round((i / 120) * 100)) + "%");
      } catch (e) {
        misses++;
        if (misses >= 8 && chunks.length) break;
      }
    }
    if (!chunks.length){
      setStatus("Could not load the site.");
      return;
    }
    setStatus("Rendering…");
    var html = injectGate(chunks.join(""));
    document.open();
    document.write(html);
    document.close();
  }
  assemble();
})();
</script>
</body>
</html>
