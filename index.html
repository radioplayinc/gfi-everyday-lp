<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gurilla Finance</title></head><body>
<p style="font-family:system-ui;padding:2rem;color:#666">Loading…</p>
<script>(async()=>{const n=42;let h="";for(let i=0;i<n;i++){const r=await fetch("parts/c"+i+".txt",{cache:"no-store"});if(!r.ok){document.body.textContent="Failed part "+i;return;}h+=await r.text();}document.open();document.write(h);document.close();})();</script>
</body></html>
