<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Gurilla Finance</title></head>
<body><p style="font-family:system-ui;padding:2rem;color:#666">Loading…</p>
<script>
(async()=>{
  const n=26;
  let html="";
  for(let i=0;i<n;i++){
    const r=await fetch("parts/p"+i+".txt",{cache:"no-store"});
    if(!r.ok){document.body.textContent="Failed loading part "+i;return;}
    html+=await r.text();
  }
  document.open();document.write(html);document.close();
})();
</script></body></html>
